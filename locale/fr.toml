"manifest.description" = "Ce plugin permet à l'utilisateur de choisir les balises que Picard doit ajouter aux fichiers de sortie."
"manifest.long_description" = "**À utiliser avec précaution, car toutes les balises ne figurant pas dans la liste « à conserver » de l'utilisateur ne seront pas écrites dans les fichiers de sortie.** Comme toujours, il est recommandé de tester d'abord votre configuration sur une **copie** d'un petit sous-ensemble de fichiers afin de vous assurer que les résultats correspondent à vos attentes.\n\nCe plugin offre à l'utilisateur une approche différente pour déterminer quelles balises sont écrites dans les fichiers de sortie par Picard. Si l'utilisateur souhaite ne conserver qu'un petit sous-ensemble des balises fournies par MusicBrainz, il peut spécifier uniquement les balises qu'il souhaite conserver plutôt que de développer un long script de balisage pour supprimer toutes les balises dont il ne veut pas.\n\nLes balises que vous souhaitez conserver sont saisies dans une page des paramètres d'options, chaque balise sur une ligne distincte. Les lignes vides seront ignorées. Les entrées ne sont pas sensibles à la casse.\n\nSi une balise de la liste se termine par un astérisque (`*`), toutes les balises commençant par cette balise seront conservées. Par exemple, si votre liste contient « `performer:*` », toutes les balises commençant par « `performer:` » seront conservées, telles que « `performer:instrument` » et « `performer:vocals` ».\n\nToutes les balises supprimées resteront disponibles en tant que variables, avec « `_ko_` » ajouté au début du nom de la balise. Par exemple, si vous choisissez de ne pas conserver la balise « `musicbrainz_trackid` », celle-ci restera disponible pour les scripts sous la forme « `%_ko_musicbrainz_trackid%` »."
"manifest.name" = "Conserver uniquement les balises"
"qt.KeepOnlyTagsOptionsPage.form.title" = "Conserver uniquement les paramètres des balises"
"qt.KeepOnlyTagsOptionsPage.page.text" = "Ces paramètres déterminent quelles balises seront écrites dans les fichiers de sortie par Picard. Les balises que vous souhaitez conserver doivent être saisies ci-dessous, chacune sur une ligne distincte. Les lignes vides seront ignorées. La saisie n'est pas sensible à la casse.\n\n**À utiliser avec précaution, car toutes les balises ne figurant pas dans la liste « à conserver » de l'utilisateur ne seront pas écrites dans les fichiers de sortie.**\n\nSi une balise de la liste se termine par un astérisque (`*`), toutes les balises commençant par cette balise seront conservées. Par exemple, si votre liste contient « `performer:*` », toutes les balises commençant par « `performer:` » seront conservées, telles que « `performer:instrument` » et « `performer:vocals` ».\n\nToutes les balises supprimées resteront disponibles en tant que variables, avec « `_ko_` » ajouté au début du nom de la balise. Par exemple, si vous choisissez de ne pas conserver la balise « `musicbrainz_trackid` », celle-ci restera disponible pour les scripts sous la forme « `%_ko_musicbrainz_trackid%` »."
"qt.KeepOnlyTagsOptionsPage.page.title" = "Conserver uniquement les balises"
"qt.KeepOnlyTagsOptionsPage.section.tags_list.placeholder" = "Balises à conserver (une par ligne)"
"qt.KeepOnlyTagsOptionsPage.section.tags_list.title" = "Balises à conserver"
"ui.title" = "Conserver uniquement les balises"

